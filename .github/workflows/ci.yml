name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: test_ci_db
          POSTGRES_USER: test_ci_user
          POSTGRES_PASSWORD: test_ci_password

        ports: ["5432:5432"]

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: test_ci_db
      DB_USER: test_ci_user
      DB_PASSWORD: test_ci_password
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: ruff check .

      - run: ruff format --check .

      - run: mypy .

      - run: python crypto_analyzer_app/manage.py makemigrations --check

      - run: python crypto_analyzer_app/manage.py migrate

      - name: unit tests
        run: pytest -m unit -q

      - name: integration tests
        run: pytest -m integration -q

